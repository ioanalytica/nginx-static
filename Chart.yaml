apiVersion: v2
name: nginx-static
version: 0.2.2
appVersion: "0.2.2"
type: application

description: >-
  Helm chart for deploying a static nginx-served website with optional
  HPA-driven scaling, a PodDisruptionBudget, a primary ingress, and an
  optional redirect ingress that maps any number of alias hosts to one
  permanent-redirect target.

home: https://github.com/ioanalytica/nginx-static
sources:
  - https://github.com/ioanalytica/nginx-static

maintainers:
  - name: IO ANALYTICA
    url: https://ioanalytica.com

keywords:
  - nginx
  - static
  - website

dependencies:
  - name: common
    repository: oci://ghcr.io/ioanalytica/charts
    version: 0.1.1

annotations:
  category: Web
  licenses: Apache-2.0
