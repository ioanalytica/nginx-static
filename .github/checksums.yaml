# The hash pins that go with a version pin. On a Renovate pull request that
# moves one of these versions, the workflow pin-checksums.yml (from
# ioanalytica/renovate-config, whose README describes every key) fills the
# sums from the release, after checking its PGP signature where one is given.
# It reads this table from the pull request's merge base, so a change here
# applies to the pull requests opened after it is merged. A new signing key
# is a decision: the run fails until it is here. oras and hadolint are CI
# only, so neither has a CHANGELOG line. The NGINX keys of docker/keys/ are no pins
# of this table: a new NGINX signing key is added by hand.

# A release installs oras with the local action; the job oras of test.yml
# fails while the sum is wrong.
- name: oras
  version: .github/actions/setup-oras/action.yml#ORAS_VERSION
  sums: https://github.com/oras-project/oras/releases/download/v{v}/oras_{v}_checksums.txt
  signature: "{sums}.asc"
  # ORAS Project Release Signing, from the KEYS file of oras-project/oras.
  key: C6FC42F0DE84A345FAADB742F44418110791EF37
  key_url: https://raw.githubusercontent.com/oras-project/oras/main/KEYS
  pins:
    - file: .github/actions/setup-oras/action.yml
      var: ORAS_SHA256
      asset: oras_{v}_linux_amd64.tar.gz

# hadolint publishes its sums unsigned: as trustworthy as the release page.
# The job hadolint of test.yml fails while the sum is wrong.
- name: hadolint
  version: .github/actions/setup-hadolint/action.yml#HADOLINT_VERSION
  sums: https://github.com/hadolint/hadolint/releases/download/v{v}/checksums.sha256
  pins:
    - file: .github/actions/setup-hadolint/action.yml
      var: HADOLINT_SHA256
      asset: hadolint-linux-x86_64

# No hash pin: the build checks the NGINX source against the keys of
# docker/keys/. The workflow only adds the line of a new version to the
# chart's changelog; what the release fixes is added to it in review.
# appVersion in chart/Chart.yaml moves in the same pull request and needs no
# entry of its own, which would add a second line.
- name: nginx
  version: docker/Dockerfile#NGINX_VERSION
  changelog:
    file: chart/CHANGELOG.md
    line: "* **NGINX {v}** in the base image, where it was {old}. A site's image has to be rebuilt on this version to run it."
