name: Feature request
description: Something the chart should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: The situation and what is missing today, rather than a solution first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could nginx-static do it?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead today?
