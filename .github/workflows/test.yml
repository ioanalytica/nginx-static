name: Test

# Pull requests run every job whatever files they touch: there is no `paths`
# filter on that trigger. A workflow skipped by a path filter leaves its
# checks pending, so a ruleset that requires `chart-test` would block every
# pull request outside the filter for good. The jobs take about a minute,
# less than the review of the pull request, so they are not skipped for
# changes that cannot affect them either: a list of such changes would have
# to follow every file the tests come to read.
#
# Pushes to main keep the filter. No merge waits for their result.
#
# Every job has a time limit: without one, a hung job holds the run for
# GitHub's default of six hours. The limits are a few times the longest run
# seen.
on:
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/**'
  pull_request:
  # A tag push runs these jobs as the `gate` job of release.yml: a release
  # publishes only what they have passed.
  workflow_call:

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  chart-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes anything back, so the token has no business staying
          # behind in .git/config.
          persist-credentials: false

      # Pinned: without a version the action asks the GitHub API for the
      # latest release on every run, and the tests would run on whichever
      # Helm that happens to be.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # chart/charts/ is gitignored, so the common dependency has to be
      # resolved here. It is a public OCI chart, no registry login needed.
      - name: Resolve chart dependencies
        run: helm dependency update chart/

      # The defaults name no ingress class, which the chart refuses on
      # purpose, so the lint names one.
      - name: Lint chart
        run: helm lint chart/ --set ingress.className=nginx

      - name: Run template test
        run: ./chart/tests/template-test.sh

      - name: Run values schema test
        run: ./chart/tests/schema-test.sh

      # The workflows, the Renovate configuration and the scripts a release
      # runs.
      - name: Run CI and release script test
        run: ./tests/ci/test.sh

  shellcheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version

      - name: Run shellcheck
        run: ./tests/ci/shellcheck.sh

  # The oras a release installs (.github/actions/setup-oras), against the sum
  # the action pins: a new version without its sum fails here, not in the
  # next tag's build, the only other place that installs it.
  oras:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Install oras
        uses: ./.github/actions/setup-oras
