name: Try it locally

# The page "Try it locally" (examples/k3d/README.md) end to end, in a k3d
# cluster on the runner: tests/try-locally/run.sh runs the page's own shell
# blocks with the values file of the checkout and compares what they print
# with what the page shows. It is the one test that meets a real ingress
# controller: the redirect is made of Traefik's own resource kinds, which a
# render cannot check against the Traefik a cluster runs.
#
# A pull request runs it with the chart of its checkout.
#
# The release workflow calls it with the version it has just published: the
# chart is then pulled from the registry. A run by hand takes a version too.
# The weekly run, and a run by hand without a version, install the latest
# release, as the page does, and catch what moves under it: the runner, k3s's
# Traefik, the NGINX image.
#
# The cluster runs the k3s image the page's step 1 names, with the k3d
# installed below; tests/ci/test.sh keeps both in step with the page's
# "Tested with" line.
on:
  pull_request:
    paths:
      - 'chart/**'
      - 'examples/k3d/**'
      - 'tests/try-locally/**'
      - '.github/workflows/try-locally.yml'
  schedule:
    # Mondays, before the working week.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      chart:
        description: The chart to install
        type: choice
        options: [release, checkout]
        default: release
      chart-version:
        description: A published version to install instead, such as 0.3.0
        type: string
  workflow_call:
    inputs:
      chart-version:
        description: The published version to install
        type: string
        required: true

# The chart and the image are pulled without a token: both are public.
permissions:
  contents: read

jobs:
  k3d:
    runs-on: ubuntu-26.04
    # A pull request's newer push replaces its run; any other run queues
    # behind one of the same event, ref and chart. On the job, not the
    # workflow: a called workflow's group is computed in the caller's
    # context, and must not be able to cancel the caller's other jobs.
    concurrency:
      group: try-locally-${{ github.event_name }}-${{ github.ref }}-${{ inputs.chart }}-${{ inputs.chart-version }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # About a minute, most of it for pulling the images. The page's waits
    # give up after 5 minutes each; the limit leaves the run time to report
    # what it found.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned: without a version the action asks the GitHub API for the
      # latest release on every run.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # The k3d the page is tested with, checked against the sums its
      # release publishes.
      - name: Install k3d
        env:
          # renovate: datasource=github-releases depName=k3d-io/k3d
          K3D_VERSION: 5.9.0
        run: |
          base="https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/k3d" "$base/k3d-linux-amd64"
          sum="$(curl -fsSL "$base/checksums.txt" | awk '$2 == "_dist/k3d-linux-amd64" { print $1 }')"
          [ -n "$sum" ] || { echo "ERROR: checksums.txt of k3d $K3D_VERSION has no k3d-linux-amd64" >&2; exit 1; }
          echo "$sum  $RUNNER_TEMP/k3d" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/k3d" /usr/local/bin/k3d
          k3d version
          kubectl version --client

      # The chart of the checkout for a pull request and for a run by hand
      # that asks for it; a published version where one is given; otherwise
      # the page as written, with the latest release.
      - name: The page, end to end
        env:
          VERSION: ${{ inputs.chart-version }}
          CHOICE: ${{ github.event_name == 'pull_request' && 'checkout' || inputs.chart }}
        run: |
          if [ -n "$VERSION" ]; then
            tests/try-locally/run.sh oci://ghcr.io/ioanalytica/charts/nginx-static --version "$VERSION"
          elif [ "$CHOICE" = checkout ]; then
            helm dependency update chart/
            tests/try-locally/run.sh ./chart
          else
            tests/try-locally/run.sh
          fi
