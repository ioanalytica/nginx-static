# Values of the page "Try it locally" (examples/k3d/README.md): the chart in
# a throwaway k3d cluster, with the project's base image, which the chart
# runs by default, and a redirect from an alias host.

# The settings of the chart's README for the base image: the restricted Pod
# Security Standard, which the page's namespace enforces, and a read-only
# root filesystem. NGINX writes its pid file and its temporary files to
# /tmp, which is a volume.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
extraVolumes:
  - name: tmp
    emptyDir: {}
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp

# One node, no metrics to speak of: a fixed single replica.
autoscaling:
  enabled: false
pdb:
  enabled: false

ingress:
  className: traefik
  hosts:
    - host: site.localhost

redirect:
  enabled: true
  targetUrl: http://site.localhost:8080
  hosts:
    - www.site.localhost
