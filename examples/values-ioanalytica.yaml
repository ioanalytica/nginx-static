# Example values for ioanalytica.com (matches k3s-io/apps/websites/ioanalytica.com).
# Install with:
#   helm install ioanalytica-site oci://ghcr.io/ioanalytica/charts/nginx-static \
#     -n websites-static -f values-ioanalytica.yaml

fullnameOverride: ioanalytica-site

image:
  registry: harbor.ioanalytica.com
  repository: io/websites/ioanalytica
  tag: "1.0.2"

ingress:
  className: nginx   # or "traefik" for path-preserving redirects
  hosts:
    - host: ioanalytica.com
  tls:
    - hosts:
        - ioanalytica.com
      secretName: tls-ioanalytica-wildcard-acme

# Single redirect Ingress covering both ioanalytica.* and ivorix.* aliases.
# One Ingress means cert-manager issues one SAN cert for the whole list.
redirect:
  enabled: true
  targetUrl: https://ioanalytica.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ingress.kubernetes.io/force-hsts: "true"
    ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - ioanalytica.ai
    - ioanalytica.at
    - ioanalytica.cc
    - ioanalytica.ch
    - ioanalytica.co
    - ioanalytica.de
    - ioanalytica.eu
    - ioanalytica.fr
    - ioanalytica.info
    - ioanalytica.io
    - ioanalytica.net
    - ioanalytica.org
    - www.ioanalytica.ai
    - www.ioanalytica.at
    - www.ioanalytica.com
    - www.ioanalytica.cc
    - www.ioanalytica.ch
    - www.ioanalytica.co
    - www.ioanalytica.de
    - www.ioanalytica.eu
    - www.ioanalytica.fr
    - www.ioanalytica.info
    - www.ioanalytica.io
    - www.ioanalytica.net
    - www.ioanalytica.org
    - ivorix.at
    - ivorix.ch
    - ivorix.co
    - ivorix.com
    - ivorix.de
    - ivorix.eu
    - ivorix.info
    - ivorix.net
    - www.ivorix.at
    - www.ivorix.ch
    - www.ivorix.co
    - www.ivorix.com
    - www.ivorix.de
    - www.ivorix.eu
    - www.ivorix.info
    - www.ivorix.net
  tls:
    - hosts:
        - ioanalytica.ai
        - ioanalytica.at
        - ioanalytica.cc
        - ioanalytica.ch
        - ioanalytica.co
        - ioanalytica.de
        - ioanalytica.eu
        - ioanalytica.fr
        - ioanalytica.info
        - ioanalytica.io
        - ioanalytica.net
        - ioanalytica.org
        - www.ioanalytica.ai
        - www.ioanalytica.at
        - www.ioanalytica.com
        - www.ioanalytica.cc
        - www.ioanalytica.ch
        - www.ioanalytica.co
        - www.ioanalytica.de
        - www.ioanalytica.eu
        - www.ioanalytica.fr
        - www.ioanalytica.info
        - www.ioanalytica.io
        - www.ioanalytica.net
        - www.ioanalytica.org
        - ivorix.at
        - ivorix.ch
        - ivorix.co
        - ivorix.com
        - ivorix.de
        - ivorix.eu
        - ivorix.info
        - ivorix.net
        - www.ivorix.at
        - www.ivorix.ch
        - www.ivorix.co
        - www.ivorix.com
        - www.ivorix.de
        - www.ivorix.eu
        - www.ivorix.info
        - www.ivorix.net
      secretName: ioanalytica-redirects.all-tls
