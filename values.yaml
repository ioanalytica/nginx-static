## @section Global parameters
##
global:
  imageRegistry: ""
  imagePullSecrets: []

## @section Common parameters
##
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
kubeVersion: ""
commonLabels: {}
commonAnnotations: {}

## @section Image parameters
##
image:
  registry: harbor.ioanalytica.com
  repository: io/websites/example
  ## Defaults to .Chart.AppVersion when empty
  tag: ""
  digest: ""
  pullPolicy: Always
  pullSecrets: []

## @section Workload parameters
##
replicaCount: 1
containerPort: 8080

## Resources: pick a preset OR set requests/limits explicitly.
## Allowed presets: nano, micro, small, medium, large, xlarge, 2xlarge.
## When resourcesPreset is set, it wins over resources.
resourcesPreset: ""
resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: 250m
    memory: 128Mi
    ephemeral-storage: 256Mi

probes:
  readiness:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 2
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 20
  startup:
    enabled: false

podSecurityContext: {}
containerSecurityContext: {}
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

## @section Autoscaling parameters
##
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 0
  ## Extra metrics appended verbatim to spec.metrics
  metrics: []
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

## @section PodDisruptionBudget parameters
##
pdb:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

## @section Service parameters
##
service:
  type: ClusterIP
  port: 80
  annotations: {}

## @section Ingress parameters
##
ingress:
  enabled: true
  ## REQUIRED. Must be set explicitly; defaulting in mixed-controller
  ## clusters is unsafe. Supported values:
  ##   - "nginx":         rke2-ingress-nginx controller serves the
  ##                      primary + redirect (kind:Ingress). cert-manager
  ##                      ingress-shim issues TLS via Ingress annotations.
  ##                      Redirect drops the request path
  ##                      (nginx-ingress limitation, no path preservation
  ##                      mechanism available).
  ##   - "nginx-traefik": Traefik's kubernetesIngressNGINX bridge
  ##                      provider serves the primary (kind:Ingress, the
  ##                      bridge translates 85+ nginx-style annotations).
  ##                      Because Traefik is present, the chart emits
  ##                      the redirect in the SAME path-preserving form
  ##                      as "traefik" (kind:Middleware +
  ##                      kind:IngressRoute, RedirectRegex with capture
  ##                      group). + kind:Certificate when the
  ##                      cert-manager.io/cluster-issuer annotation is
  ##                      set (ingress-shim doesn't watch IngressRoute).
  ##                      Pick this when commonAnnotations /
  ##                      ingress.annotations carry nginx-specific
  ##                      hints worth keeping during migration.
  ##   - "traefik":       Traefik's kubernetesIngress provider serves
  ##                      the primary (kind:Ingress, cert-shim still
  ##                      works); the redirect is rendered as
  ##                      kind:Middleware + kind:IngressRoute (+ optional
  ##                      kind:Certificate). Path-preserving.
  className: ""
  pathType: ImplementationSpecific

  ## Annotations applied to BOTH the primary ingress and every redirect.
  ## Override or extend per-ingress via ingress.annotations / redirects[].annotations.
  commonAnnotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      # Dot-Ban: .env, .git, .htaccess etc.
      location ~ /\. {
        return 444;
      }
      # PHP-Ban: static site, no PHP
      location ~ \.php$ {
        return 444;
      }
      # WordPress-ban: block common WP scan paths
      location ~* ^/(wp-admin|wp-includes|wp-content|wp-login\.php|wp-cron\.php|xmlrpc\.php) {
        return 444;
      }

  ## Extra annotations merged on top of commonAnnotations for the primary ingress only
  annotations: {}

  hosts:
    - host: example.com
      paths:
        - path: /
          pathType: ImplementationSpecific

  tls: []
  ## Example:
  ## tls:
  ##   - hosts:
  ##       - example.com
  ##     secretName: example-com-tls

## @section Redirect ingress
##
## Optional single redirect Ingress. Every host in redirect.hosts responds with
## a permanent redirect to redirect.targetUrl (via the
## nginx.ingress.kubernetes.io/permanent-redirect annotation). One Ingress means
## one TLS list, which keeps cert-manager requests simple even with many alias
## domains. ingress.commonAnnotations are merged automatically;
## redirect.annotations override.
redirect:
  enabled: false
  targetUrl: ""
  annotations: {}
  hosts: []
  tls: []
## Example:
## redirect:
##   enabled: true
##   targetUrl: https://example.com
##   annotations:
##     cert-manager.io/cluster-issuer: letsencrypt-prod
##   hosts:
##     - www.example.com
##     - example.net
##   tls:
##     - hosts:
##         - www.example.com
##         - example.net
##       secretName: example-aliases-tls
