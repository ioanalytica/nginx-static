{{/*
Copyright IO ANALYTICA. All Rights Reserved.
SPDX-License-Identifier: Apache-2.0

Optional redirect ingresses. Each entry in .Values.redirects produces one
Ingress whose hosts respond with a permanent redirect to .targetUrl.
*/}}
{{- range $idx, $redirect := .Values.redirects }}
{{- if and $redirect (default true $redirect.enabled) }}
{{- if not $redirect.targetUrl }}
{{- fail (printf "redirects[%d]: targetUrl is required" $idx) }}
{{- end }}
---
apiVersion: {{ include "common.capabilities.ingress.apiVersion" $ }}
kind: Ingress
metadata:
  name: {{ include "nginx-static.redirect.name" (dict "redirect" $redirect "index" $idx "context" $) }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" (include "nginx-static.ingress.redirectAnnotations" (dict "redirect" $redirect "context" $) | fromYaml) "context" $) | nindent 4 }}
spec:
  {{- if and $.Values.ingress.className (eq "true" (include "common.ingress.supportsIngressClassname" $)) }}
  ingressClassName: {{ $.Values.ingress.className | quote }}
  {{- end }}
  rules:
    {{- range $redirect.hosts }}
    - host: {{ . | quote }}
    {{- end }}
  {{- with $redirect.tls }}
  tls: {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
