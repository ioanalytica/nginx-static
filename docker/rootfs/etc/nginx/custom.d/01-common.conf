# The site's files, its log and the defaults every site shares. A site's
# image may replace this file; it then defines /healthz itself.

root   /var/www/html;
index  index.html index.htm;

access_log /dev/stdout custom;

# security headers
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;

# The chart's liveness probe.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
}

# Hidden files are never served.
location ~ /\. {
    return 403;
}
