# The site's files, its log and the defaults every site shares. A site's
# image may replace this file; it then defines /healthz itself, and `/` as
# well if it needs more there than the index directive.

root   /var/www/html;
index  index.html index.htm;

access_log /dev/stdout custom;

# security headers
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;

# The start page: the site's, or the base image's placeholder while the
# document root has none. The placeholder is kept outside the document root,
# which the base image leaves empty: a site's image adds files and cannot
# take one away, so a placeholder in there would stay reachable as
# /index.html in every site that has no file of that name.
#
# The index directive is the one in force for the site, also one it sets
# itself, and it finds the site's page as it does in any directory, with a
# new lookup of the location. Only when it finds none, where NGINX answers
# 403 for a directory it may not list, the placeholder takes that answer's
# place.
#
# A static file answers GET and HEAD and no other method, and so does the
# placeholder: without the check, error_page would answer a POST with it.
location = / {
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    error_page 403 =200 /nginx-static-placeholder;
}
location = /nginx-static-placeholder {
    internal;
    default_type text/html;
    alias /usr/share/nginx-static/placeholder.html;
}

# The chart's liveness probe.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
}

# Hidden files are never served.
location ~ /\. {
    return 403;
}
