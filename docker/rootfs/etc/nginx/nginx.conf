# NGINX for a static website behind an ingress controller. A site's image
# adds to /etc/nginx/custom.d/, which the server block includes; it does not
# need to replace this file.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    multi_accept on;
    worker_connections 1024;
}

http {
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    log_not_found off;
    types_hash_max_size 2048;
    types_hash_bucket_size 64;
    uninitialized_variable_warn off;

    # MIME
    include mime.types;
    default_type application/octet-stream;

    # The access log names the client as the ingress controller reports it,
    # with the headers a CDN in front adds.
    log_format custom '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $http_cf_ray $http_cf_connecting_ip $http_x_forwarded_for $http_x_forwarded_proto $http_true_client_ip $http_cf_ipcountry $http_cf_visitor $http_cdn_loop';

    access_log off;
    error_log /dev/stderr error;

    # The client's address behind the ingress controller; custom.d says whom
    # to believe (set_real_ip_from).
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
