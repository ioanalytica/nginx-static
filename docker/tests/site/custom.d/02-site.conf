# The site's own rules, next to the base image's.
gzip_static on;

location = /old {
    return 301 /;
}

# A map would go into the http block; in a server block the site has if,
# rewrite and return.
location ~ \.php$ {
    return 418;
}

# A rule for the start page under its own name: the index directive looks
# the location up again, so it holds for / as well.
location = /index.html {
    add_header X-Smoke-Index "1" always;
}
